services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-marine_annotate}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No published port — only the backend container (on the compose network)
    # needs to reach Postgres. Use `docker compose exec db psql -U marine
    # marine_annotate` for admin access instead of exposing it to the host.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marine} -d ${POSTGRES_DB:-marine_annotate}"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env — see .env.example}"]
    # No published port either — same reasoning as db above.
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      # Bound to loopback only — reachable as localhost:8000 for local
      # debugging, but not from the network. Caddy/frontend reach it via the
      # internal compose network (service name), not this published port.
      - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Force asyncpg driver — overrides anything in backend/.env for the container
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-marine}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-marine_annotate}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  # Runs AI inference jobs (see app/services/inference.py) off the API
  # process. Same image as backend, just a different command — the
  # entrypoint still applies, so RUN_MIGRATIONS=false stops it from racing
  # the backend container's own `alembic upgrade head` on startup.
  # --pool=solo avoids forking (Celery's default) entirely, since forking a
  # process that already opened async DB connections is unsafe — fine for
  # this workload since jobs are infrequent, GPU/CPU-bound, and realistically
  # one-at-a-time for a single lab. Scale with `docker compose up -d --scale
  # celery_worker=2` (separate containers, not in-process forking) if needed.
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["celery", "-A", "app.core.celery_app", "worker", "--loglevel=info", "--pool=solo"]
    env_file:
      - ./backend/.env
    environment:
      RUN_MIGRATIONS: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-marine}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-marine_annotate}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      # Bound to loopback only — same reasoning as backend above. Direct,
      # unencrypted access stays available at localhost:5173 for local dev,
      # but the network-facing entrance is only ever Caddy (see the `tls`
      # profile below), so there's no way to bypass HTTPS from outside.
      - "127.0.0.1:5173:80"
    depends_on:
      - backend

  # Optional TLS-terminating reverse proxy — the actual network-facing
  # entrance for any deployment beyond a single local machine. Not started by
  # default; enable with `docker compose --profile tls up -d --build`.
  # Automatically gets a real Let's Encrypt certificate if DOMAIN is a public
  # domain name pointed at this server, or a locally-trusted self-signed
  # certificate if it's an IP/localhost (Caddy detects this automatically —
  # see Caddyfile). See README's TLS section for the full setup.
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

  # Optional — lets a remote lab member reach this instance without any
  # router/port-forwarding changes (works even behind ISP CGNAT, which makes
  # port-forwarding impossible outright). Not started by default. Two modes,
  # as separate profiles since the cloudflared image has no shell to branch
  # on a token being set — see README's "Remote Team Access" section.
  #
  # Zero-config: docker compose --profile tunnel up -d
  # Gets a free, instant *.trycloudflare.com address (find it with
  # ./scripts/get-tunnel-url.sh after starting) — fine to unblock a remote
  # invite today, but Cloudflare gives it no uptime guarantee and the
  # address changes if this container ever restarts.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: ["tunnel", "--url", "http://frontend:80"]
    depends_on:
      - frontend
    restart: on-failure

  # Stable, permanent address: create a named tunnel in the Cloudflare Zero
  # Trust dashboard (free account + a domain you own), set TUNNEL_TOKEN in
  # the root .env to the token it gives you, then:
  #   docker compose --profile tunnel-named up -d
  cloudflared-named:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel-named"]
    # Can't use the required-variable ${VAR:?...} syntax here — compose
    # validates it file-wide even when this profile isn't the one active,
    # which would break the plain `tunnel` profile above for anyone who
    # hasn't set TUNNEL_TOKEN. An empty token fails at cloudflared itself
    # with a clear error instead, only when this profile actually runs.
    command: ["tunnel", "run", "--token", "${TUNNEL_TOKEN:-}"]
    depends_on:
      - frontend
    restart: on-failure

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
