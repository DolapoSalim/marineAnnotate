name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: marine_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d marine_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-test.txt

      - name: Install test dependencies
        working-directory: backend
        # requirements-test.txt deliberately excludes torch/ultralytics —
        # nothing under test imports them (YOLO is only ever loaded lazily
        # inside run_inference_job), so installing ~9GB of ML deps here
        # would just slow down every CI run for no coverage gained.
        run: pip install -r requirements-test.txt

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/marine_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-only-secret-never-used-outside-this-workflow-0123456789
          FIRST_ADMIN_EMAIL: admin@test.local
          FIRST_ADMIN_PASSWORD: TestAdminPassword123
          ALLOWED_ORIGINS: '["http://testserver"]'
        run: pytest -v
